[platformio]
default_envs = controller_nano
src_dir = controller

[env:controller_nano]
platform = atmelavr@5.3.0
board = nanoatmega328
framework = arduino
monitor_speed = 115200
lib_deps =
    autowp/autowp-mcp2515@1.3.1
    lexus2k/ssd1306@1.8.8
build_src_flags =
    -Wall
    -Wextra
    -Werror
build_src_filter =
    +<*>
    -<tests/>
